<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines }}">
    <link rel="icon" type="image/jpeg" href="{{ '/Clock.jpeg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}">
          <span class="site-brand__name">{{ site.title }}</span>
          <span class="site-brand__tag">{{ site.description }}</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/about/' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/results/' | relative_url }}" {% if page.nav == 'results' %}aria-current="page"{% endif %}>Results</a>
          <a href="{{ '/method/' | relative_url }}" {% if page.nav == 'method' %}aria-current="page"{% endif %}>Method</a>
          <a href="{{ '/repo/' | relative_url }}" {% if page.nav == 'repo' %}aria-current="page"{% endif %}>Repo</a>
        </nav>
      </div>
    </header>

    <main class="shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer shell">
      <p>Prototype research site for EvoNashMTL.</p>
    </footer>
  </body>
</html>
